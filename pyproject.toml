[project]
name = "cosmos77-hub"
version = "0.1.0"
description = "COSMOS77 arena hub — reverse proxy, run manager, live viewer feed, replay builder"
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = { text = "MIT" }
authors = [
    { name = "Tasneem Natour" },
    { name = "Abdallah Khaldi" },
]
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "httpx",
]

[project.scripts]
cosmos-hub-counted = "cosmos_hub.counted_cli:main"

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cosmos_hub"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "RUF", "D", "ANN"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D", "ANN"]
